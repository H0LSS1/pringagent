# 前端容器内的 nginx 配置：
#   /      -> Vue 构建出的静态文件（history 路由回退到 index.html，刷新不 404）
#   /api/  -> 反向代理到 backend:8000（docker 网络内按服务名访问）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：/pressure、/chat 直接刷新时返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理（含 SSE 长连接）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # SSE 必须关闭缓冲，否则事件会被 nginx 攒着不发给浏览器
        proxy_buffering off;
        proxy_cache off;

        # 长对话不断流：读超时放宽，清空 Connection 头走长连接
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
